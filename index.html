<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Swift</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsOTP/2.0.0/jsOTP.min.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --accent: #0A84FF; --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; background: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 12px; padding: 12px; color: white; font-size: 14px; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .code { font-size: 60px; font-weight: 800; color: var(--accent); letter-spacing: 4px; margin: 10px 0; }
        .timer-bar { width: 100%; height: 4px; background: #333; margin-top: 20px; }
        #progress { height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" id="secret" placeholder="Вставьте ключ (Base32)" spellcheck="false">
        <div class="code" id="otp">000000</div>
        <div class="timer-bar"><div id="progress"></div></div>
        <div id="status" style="color: #8e8e93; font-size: 12px; margin-top: 10px;">ОЖИДАНИЕ</div>
    </div>

<script>
    const secretInput = document.getElementById('secret');
    const otpDisplay = document.getElementById('otp');
    const progress = document.getElementById('progress');

    function update() {
        // Убираем всё, что не входит в стандарт Base32 (A-Z, 2-7)
        let val = secretInput.value.replace(/[^A-Za-z2-7]/g, '').toUpperCase();
        
        if (!val) {
            otpDisplay.innerText = "000000";
            return;
        }

        try {
            const totp = new jsOTP.totp();
            const code = totp.getOtp(val);
            otpDisplay.innerText = code;
            
            const seconds = Math.floor(Date.now() / 1000) % 30;
            progress.style.width = ((30 - seconds) / 30 * 100) + "%";
            document.getElementById('status').innerText = "КОД АКТИВЕН";
        } catch (e) {
            otpDisplay.innerText = "ERROR";
            document.getElementById('status').innerText = "НЕВЕРНЫЙ СИМВОЛ В КЛЮЧЕ";
        }
    }

    secretInput.addEventListener('input', update);
    setInterval(update, 1000);
</script>
</body>
</html>
