<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Pro</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=1">
    <link rel="apple-touch-icon" href="icon.png?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>

    <style>
        :root { 
            --bg: #000; 
            --card: #1c1c1e; 
            --accent: #0A84FF; 
            --success: #32d74b; 
            --text: #fff; 
            --muted: #8e8e93;
            --input: #2c2c2e;
            --border: #3a3a3c;
        }

        body { 
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }

        .card { 
            background: var(--card); 
            padding: 24px; 
            border-radius: 24px; 
            width: 100%; 
            max-width: 390px; 
            text-align: center; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        textarea { 
            width: 100%; 
            min-height: 120px;
            resize: vertical;
            background: var(--input); 
            border: 2px solid var(--border); 
            border-radius: 14px; 
            padding: 12px; 
            color: white; 
            font-size: 14px; 
            margin-bottom: 16px; 
            outline: none; 
            box-sizing: border-box; 
            text-align: left; 
            transition: all 0.2s;
            font-family: inherit;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: var(--accent);
            background: #3a3a3c;
        }

        textarea::placeholder {
            color: #777;
        }

        .codes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }

        .code-row {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 16px;
            padding: 14px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .code { 
            font-size: 42px; 
            font-weight: 800; 
            color: var(--accent); 
            letter-spacing: 4px; 
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            transition: transform 0.1s, color 0.2s;
            user-select: none;
            line-height: 1;
        }

        .code:active { 
            transform: scale(0.95); 
        }

        .empty {
            color: var(--muted);
            font-size: 13px;
            padding: 20px 0 8px;
            text-transform: uppercase;
        }

        .timer-bar { 
            width: 100%; 
            height: 4px; 
            background: #333; 
            margin-top: 16px; 
            border-radius: 2px; 
            overflow: hidden; 
        }

        #progress { 
            height: 100%; 
            background: var(--accent); 
            width: 100%; 
            transition: width 1s linear, background-color 0.3s ease; 
        }

        .status { 
            color: var(--muted); 
            font-size: 12px; 
            margin-top: 15px; 
            text-transform: uppercase; 
            min-height: 14px; 
        }
    </style>
</head>

<body>
    <div class="card">
        <textarea 
            id="secrets" 
            placeholder="Вставь 2FA ключи&#10;Каждый ключ с новой строки"
            autocomplete="off" 
            spellcheck="false"></textarea>

        <div class="codes-list" id="codesList">
            <div class="empty">Ожидание ключей</div>
        </div>

        <div class="timer-bar">
            <div id="progress"></div>
        </div>

        <div class="status" id="timer">ОЖИДАНИЕ</div>
    </div>

<script>
    const secretsInput = document.getElementById('secrets');
    const codesList = document.getElementById('codesList');
    const progress = document.getElementById('progress');
    const timerText = document.getElementById('timer');

    let isShowingCopyMessage = false;

    function base32tohex(base32) {
        const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        let bits = "";
        let hex = "";

        base32 = base32.replace(/\s/g, '').toUpperCase();

        for (let i = 0; i < base32.length; i++) {
            const val = base32chars.indexOf(base32.charAt(i));

            if (val === -1) {
                continue;
            }

            bits += val.toString(2).padStart(5, '0');
        }

        for (let i = 0; i + 4 <= bits.length; i += 4) {
            const chunk = bits.substr(i, 4);
            hex += parseInt(chunk, 2).toString(16);
        }

        return hex;
    }

    function generateOTP(secret) {
        const keyHex = base32tohex(secret);

        if (!keyHex) {
            return "ERROR";
        }

        const epoch = Math.round(new Date().getTime() / 1000.0);

        let time = Math.floor(epoch / 30).toString(16);
        while (time.length < 16) {
            time = "0" + time;
        }

        const shaObj = new jsSHA("SHA-1", "HEX");
        shaObj.setHMACKey(keyHex, "HEX");
        shaObj.update(time);

        const hmac = shaObj.getHMAC("HEX");
        const offset = parseInt(hmac.substring(hmac.length - 1), 16);

        let otp = (parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff) + "";
        otp = otp.substr(otp.length - 6, 6);

        return otp;
    }

    function getSecrets() {
        return secretsInput.value
            .split('\n')
            .map(item => item.trim())
            .filter(item => item.length > 0);
    }

    async function copyCode(code, element) {
        if (!code || code === "ERROR") {
            return;
        }

        try {
            await navigator.clipboard.writeText(code);

            isShowingCopyMessage = true;

            const oldColor = element.style.color;

            element.style.color = "var(--success)";
            timerText.innerText = "СКОПИРОВАНО В БУФЕР";
            timerText.style.color = "var(--success)";
            progress.style.backgroundColor = "var(--success)";

            setTimeout(() => {
                isShowingCopyMessage = false;

                element.style.color = oldColor || "var(--accent)";
                timerText.style.color = "var(--muted)";
                progress.style.backgroundColor = "var(--accent)";

                update();
            }, 1500);

        } catch (err) {
            timerText.innerText = "ОШИБКА КОПИРОВАНИЯ";
            timerText.style.color = "#ff453a";
        }
    }

    function update() {
        const secrets = getSecrets();

        if (secrets.length === 0) {
            codesList.innerHTML = '<div class="empty">Ожидание ключей</div>';
            progress.style.width = "100%";

            if (!isShowingCopyMessage) {
                timerText.innerText = "ОЖИДАНИЕ";
                timerText.style.color = "var(--muted)";
            }

            return;
        }

        codesList.innerHTML = "";

        secrets.forEach(secret => {
            const otp = generateOTP(secret);

            const row = document.createElement('div');
            row.className = 'code-row';

            const code = document.createElement('div');
            code.className = 'code';
            code.innerText = otp;
            code.title = 'Нажми, чтобы скопировать';

            if (otp === "ERROR") {
                code.style.color = "#ff453a";
            }

            code.addEventListener('click', () => copyCode(otp, code));

            row.appendChild(code);
            codesList.appendChild(row);
        });

        const epoch = Math.round(new Date().getTime() / 1000.0);
        const seconds = epoch % 30;
        const left = 30 - seconds;

        progress.style.width = (left / 30 * 100) + "%";

        if (!isShowingCopyMessage) {
            timerText.innerText = `ОБНОВЛЕНИЕ ЧЕРЕЗ ${left}`;
            timerText.style.color = "var(--muted)";
        }
    }

    secretsInput.addEventListener('input', update);

    setInterval(update, 1000);

    window.onload = () => {
        secretsInput.focus();
        update();
    };
</script>
</body>
</html>
