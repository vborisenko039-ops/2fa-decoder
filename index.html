<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Pro</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=1">
    <link rel="apple-touch-icon" href="icon.png?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>

    <style>
        :root {
            --bg: #000;
            --card: #1c1c1e;
            --panel: #242426;
            --input: #2c2c2e;
            --border: #3a3a3c;
            --accent: #0A84FF;
            --success: #32d74b;
            --danger: #ff453a;
            --text: #fff;
            --muted: #8e8e93;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top, #111 0%, #000 55%);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 980px;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            min-height: 520px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 410px;
            resize: none;
            background: var(--input);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            line-height: 1.65;
            outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            background: #303033;
        }

        textarea::placeholder {
            color: #666;
        }

        .codes-list {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            gap: 10px;
            height: 410px;
        }

        .code-row {
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 16px;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .code {
            width: 100%;
            text-align: center;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 850;
            color: var(--accent);
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            transition: transform 0.1s, color 0.2s;
        }

        .code:active {
            transform: scale(0.95);
        }

        .code.empty-code {
            color: #555;
            font-size: 18px;
            letter-spacing: 0;
            cursor: default;
            font-weight: 700;
        }

        .timer-bar {
            width: 100%;
            height: 5px;
            background: #333;
            margin-top: 18px;
            border-radius: 100px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            background: var(--accent);
            width: 100%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 14px;
            text-transform: uppercase;
            min-height: 14px;
            text-align: center;
            letter-spacing: 0.04em;
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
                align-items: flex-start;
            }

            .app {
                padding: 16px;
                border-radius: 22px;
            }

            .layout {
                grid-template-columns: 1fr;
                min-height: auto;
                gap: 16px;
            }

            textarea {
                min-height: 230px;
                font-size: 14px;
            }

            .codes-list {
                height: auto;
                grid-template-rows: none;
                grid-auto-rows: 58px;
            }

            .code {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="layout">
            <div class="panel">
                <div class="panel-title">Ключи</div>

                <textarea
                    id="secrets"
                    placeholder="Вставь до 8 ключей&#10;Каждый ключ с новой строки&#10;&#10;JBSWY3DPEHPK3PXP&#10;JBSWY3DPEHPK3PXQ"
                    autocomplete="off"
                    spellcheck="false"></textarea>
            </div>

            <div class="panel">
                <div class="panel-title">Коды</div>

                <div class="codes-list" id="codesList"></div>
            </div>
        </div>

        <div class="timer-bar">
            <div id="progress"></div>
        </div>

        <div class="status" id="timer">ОЖИДАНИЕ</div>
    </div>

<script>
    const secretsInput = document.getElementById('secrets');
    const codesList = document.getElementById('codesList');
    const progress = document.getElementById('progress');
    const timerText = document.getElementById('timer');

    const MAX_KEYS = 8;
    let isShowingCopyMessage = false;

    function base32tohex(base32) {
        const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        let bits = "";
        let hex = "";

        base32 = base32.replace(/\s/g, '').toUpperCase();

        for (let i = 0; i < base32.length; i++) {
            const val = base32chars.indexOf(base32.charAt(i));

            if (val === -1) {
                continue;
            }

            bits += val.toString(2).padStart(5, '0');
        }

        for (let i = 0; i + 4 <= bits.length; i += 4) {
            const chunk = bits.substr(i, 4);
            hex += parseInt(chunk, 2).toString(16);
        }

        return hex;
    }

    function generateOTP(secret) {
        const keyHex = base32tohex(secret);

        if (!keyHex) {
            return "ERROR";
        }

        const epoch = Math.round(new Date().getTime() / 1000.0);

        let time = Math.floor(epoch / 30).toString(16);
        while (time.length < 16) {
            time = "0" + time;
        }

        const shaObj = new jsSHA("SHA-1", "HEX");
        shaObj.setHMACKey(keyHex, "HEX");
        shaObj.update(time);

        const hmac = shaObj.getHMAC("HEX");
        const offset = parseInt(hmac.substring(hmac.length - 1), 16);

        let otp = (parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff) + "";
        otp = otp.substr(otp.length - 6, 6);

        return otp;
    }

    function getSecrets() {
        return secretsInput.value
            .split('\n')
            .map(item => item.trim())
            .filter(item => item.length > 0)
            .slice(0, MAX_KEYS);
    }

    async function copyCode(code, element) {
        if (!code || code === "ERROR" || code === "—") {
            return;
        }

        try {
            await navigator.clipboard.writeText(code);

            isShowingCopyMessage = true;

            element.style.color = "var(--success)";
            timerText.innerText = "СКОПИРОВАНО В БУФЕР";
            timerText.style.color = "var(--success)";
            progress.style.backgroundColor = "var(--success)";

            setTimeout(() => {
                isShowingCopyMessage = false;

                element.style.color = "var(--accent)";
                timerText.style.color = "var(--muted)";
                progress.style.backgroundColor = "var(--accent)";

                update();
            }, 1200);

        } catch (err) {
            timerText.innerText = "ОШИБКА КОПИРОВАНИЯ";
            timerText.style.color = "var(--danger)";
        }
    }

    function createCodeRow(value, isEmpty = false, isError = false) {
        const row = document.createElement('div');
        row.className = 'code-row';

        const code = document.createElement('div');
        code.className = isEmpty ? 'code empty-code' : 'code';
        code.innerText = value;

        if (isError) {
            code.style.color = "var(--danger)";
        }

        if (!isEmpty && !isError) {
            code.title = 'Нажми, чтобы скопировать';
            code.addEventListener('click', () => copyCode(value, code));
        }

        row.appendChild(code);
        return row;
    }

    function renderEmptyRows(filledCount) {
        for (let i = filledCount; i < MAX_KEYS; i++) {
            codesList.appendChild(createCodeRow("—", true));
        }
    }

    function update() {
        const secrets = getSecrets();

        codesList.innerHTML = "";

        if (secrets.length === 0) {
            renderEmptyRows(0);
            progress.style.width = "100%";

            if (!isShowingCopyMessage) {
                timerText.innerText = "ОЖИДАНИЕ";
                timerText.style.color = "var(--muted)";
            }

            return;
        }

        secrets.forEach(secret => {
            const otp = generateOTP(secret);
            const isError = otp === "ERROR";

            codesList.appendChild(createCodeRow(otp, false, isError));
        });

        renderEmptyRows(secrets.length);

        const epoch = Math.round(new Date().getTime() / 1000.0);
        const seconds = epoch % 30;
        const left = 30 - seconds;

        progress.style.width = (left / 30 * 100) + "%";

        if (!isShowingCopyMessage) {
            timerText.innerText = `ОБНОВЛЕНИЕ ЧЕРЕЗ ${left}`;
            timerText.style.color = "var(--muted)";
        }
    }

    secretsInput.addEventListener('input', update);

    setInterval(update, 1000);

    window.onload = () => {
        secretsInput.focus();
        update();
    };
</script>
</body>
</html>
