<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Decoder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otplib/12.0.1/otplib-browser.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --accent: #0A84FF; --text: #fff; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0;
        }
        .card { 
            background: var(--card); padding: 30px; border-radius: 24px; 
            width: 90%; max-width: 350px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        input { 
            width: 100%; background: #2c2c2e; border: 2px solid #3a3a3c; 
            border-radius: 12px; padding: 12px; color: white; 
            font-size: 16px; margin-bottom: 20px; outline: none; box-sizing: border-box;
            text-align: center;
        }
        input:focus { border-color: var(--accent); }
        .code { 
            font-size: 56px; font-weight: 800; color: var(--accent); 
            letter-spacing: 4px; margin: 10px 0; font-variant-numeric: tabular-nums;
        }
        .progress-container { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 20px; }
        #progress { width: 100%; height: 100%; background: var(--accent); transition: width 0.5s linear; }
        .status { color: #8e8e93; font-size: 12px; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="card">
    <input type="text" id="secret" placeholder="Вставьте Secret Key" autocomplete="off" autocapitalize="off">
    <div class="code" id="otp">000000</div>
    <div class="progress-container"><div id="progress"></div></div>
    <div class="status" id="timer">Введите ключ</div>
</div>

<script>
    const otplib = window.otplib;
    const secretInput = document.getElementById('secret');
    const otpDisplay = document.getElementById('otp');
    const progress = document.getElementById('progress');
    const timerText = document.getElementById('timer');

    // 1. Загружаем ключ из памяти браузера (LocalStorage), если он там есть
    const savedSecret = localStorage.getItem('2fa_secret');
    if (savedSecret) {
        secretInput.value = savedSecret;
    }

    function updateOTP() {
        const secret = secretInput.value.replace(/\s/g, '').toUpperCase();
        if (!secret) {
            otpDisplay.innerText = "000000";
            timerText.innerText = "Ожидание ключа";
            return;
        }

        try {
            // Сохраняем ключ в память, чтобы он не пропадал
            localStorage.setItem('2fa_secret', secret);

            // Генерируем код (без запросов к серверу!)
            const token = otplib.authenticator.generate(secret);
            otpDisplay.innerText = token;
            
            const seconds = Math.floor(Date.now() / 1000) % 30;
            const timeLeft = 30 - seconds;
            progress.style.width = (timeLeft / 30 * 100) + "%";
            timerText.innerText = `Обновится через ${timeLeft}с`;
        } catch (err) {
            otpDisplay.innerText = "ERROR";
            timerText.innerText = "Неверный формат ключа";
        }
    }

    // Слушаем ввод и обновляем код каждую секунду
    secretInput.addEventListener('input', updateOTP);
    setInterval(updateOTP, 1000);
    updateOTP(); // Запуск при загрузке
</script>

</body>
</html>
