<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Decoder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otplib/12.0.1/otplib-browser.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --accent: #0A84FF; --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        input { width: 100%; background: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 12px; padding: 12px; color: white; font-size: 14px; margin-bottom: 20px; outline: none; box-sizing: border-box; text-align: center; }
        .code { font-size: 64px; font-weight: 800; color: var(--accent); letter-spacing: 4px; margin: 10px 0; }
        .timer-bar { width: 100%; height: 4px; background: #333; margin-top: 20px; border-radius: 2px; overflow: hidden; }
        #progress { height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
        .status { color: #8e8e93; font-size: 12px; margin-top: 10px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" id="secret" placeholder="Вставьте Secret Key" autocomplete="off" spellcheck="false">
        <div class="code" id="otp">000000</div>
        <div class="timer-bar"><div id="progress"></div></div>
        <div class="status" id="timer">ОЖИДАНИЕ КЛЮЧА</div>
    </div>

<script>
    const otplib = window.otplib;
    const secretInput = document.getElementById('secret');
    const otpDisplay = document.getElementById('otp');
    const progress = document.getElementById('progress');
    const timerText = document.getElementById('timer');

    function update() {
        // Очищаем ввод: только A-Z и 2-7. Всё остальное игнорируем.
        let raw = secretInput.value;
        let clean = raw.replace(/[^A-Za-z2-7]/g, '').toUpperCase();
        
        if (!clean) {
            otpDisplay.innerText = "000000";
            timerText.innerText = "ВВЕДИТЕ КЛЮЧ";
            return;
        }

        try {
            // Генерация по стандарту RFC 6238
            const token = otplib.authenticator.generate(clean);
            otpDisplay.innerText = token;
            
            const timeLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
            progress.style.width = (timeLeft / 30 * 100) + "%";
            timerText.innerText = `ОБНОВЛЕНИЕ ЧЕРЕЗ ${timeLeft}С`;
        } catch (err) {
            otpDisplay.innerText = "ERROR";
            timerText.innerText = "ОШИБКА ФОРМАТА";
        }
    }

    secretInput.addEventListener('input', update);
    setInterval(update, 1000);
</script>
</body>
</html>
