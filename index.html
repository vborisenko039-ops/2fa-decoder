<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Pro</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon.png?v=1">
    <link rel="apple-touch-icon" href="icon.png?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>

    <style>
        :root {
            --bg: #000;
            --bg-light-top: #111;
            --card: #1c1c1e;
            --panel: #242426;
            --input: #2c2c2e;
            --border: #3a3a3c;
            --accent: #0A84FF;
            --success: #32d74b;
            --danger: #ff453a;
            --text: #fff;
            --muted: #8e8e93;
        }

        body.light {
            --bg: #f2f2f7;
            --bg-light-top: #ffffff;
            --card: #ffffff;
            --panel: #ffffff;
            --input: #ffffff;
            --border: #d1d1d6;
            --text: #111111;
            --muted: #6e6e73;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at top, var(--bg-light-top) 0%, var(--bg) 55%);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 100%;
            max-width: 980px;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            min-height: 520px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 100%;
            min-height: 410px;
            resize: none;
            background: var(--input);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            line-height: 1.65;
            outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            transition: 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            background: var(--input);
        }

        textarea::placeholder {
            color: #666;
        }

        .clear-btn {
            margin-top: 12px;
            width: 100%;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--input);
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .clear-btn:hover {
            background: #343438;
            color: var(--text);
        }

        .clear-btn:active {
            transform: scale(0.98);
        }

        .codes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 410px;
            overflow: visible;
        }

        .code-row {
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: 14px;
            height: 42px;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .code {
            width: 100%;
            text-align: center;
            font-size: clamp(22px, 2.6vw, 30px);
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            transition: transform 0.1s, color 0.2s;
        }

        .code:active {
            transform: scale(0.95);
        }

        .empty-state {
            height: 410px;
            border: 1px dashed var(--border);
            border-radius: 16px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            text-transform: uppercase;
        }

        .timer-bar {
            width: 100%;
            height: 5px;
            background: #333;
            margin-top: 18px;
            border-radius: 100px;
            overflow: hidden;
        }

        #progress {
            height: 100%;
            background: var(--accent);
            width: 100%;
            transition: width 1s linear, background-color 0.3s ease;
        }

        .status {
            color: var(--muted);
            font-size: 12px;
            margin-top: 14px;
            text-transform: uppercase;
            min-height: 14px;
            text-align: center;
            letter-spacing: 0.04em;
        }

        @media (max-width: 760px) {
            body {
                padding: 14px;
                align-items: flex-start;
            }

            .app {
                padding: 16px;
                border-radius: 22px;
            }

            .layout {
                grid-template-columns: 1fr;
                min-height: auto;
                gap: 16px;
            }

            textarea {
                min-height: 230px;
                font-size: 14px;
            }

            .codes-list {
                min-height: auto;
                gap: 10px;
            }

            .code-row {
                height: 40px;
                min-height: 40px;
            }

            .code {
                font-size: 26px;
                letter-spacing: 3px;
            }

            .empty-state {
                height: 180px;
            }
        }
    
.theme-btn {
    position:absolute;
    top:18px;
    right:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--input);
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.25s ease;
}

.theme-btn:hover {
    transform:scale(1.08);
}

.theme-btn svg {
    width:21px;
    height:21px;
    fill:none;
    stroke:currentColor;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.moon-icon {
    display:none;
}

body.light .sun-icon {
    display:none;
}

body.light .moon-icon {
    display:block;
}

.app {
    position:relative;
}

.select-btn {
    margin-top:10px;
    width:100%;
    height:42px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--input);
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease;
}

.select-btn:hover {
    border-color:var(--input);
    color:var(--text);
}

.select-btn:active {
    transform:scale(.98);
}

.code-row.selected {
    border-color: var(--success);
    background: rgba(50, 215, 75, 0.15);
    box-shadow: 0 0 0 2px rgba(50, 215, 75, 0.2);
    transition: .25s ease;
}
</style>
</head>

<body>
    <div class="app">
        <button class="theme-btn" id="themeBtn" aria-label="Переключить тему">
            <svg class="sun-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
        <div class="layout">
            <div class="panel">
                <div class="panel-title">Ключи</div>

                <textarea
                    id="secrets"
                    placeholder="Вставь до 8 ключей&#10;Каждый ключ с новой строки&#10;&#10;JBSWY3DPEHPK3PXP&#10;JBSWY3DPEHPK3PXQ"
                    autocomplete="off"
                    spellcheck="false"></textarea>

                <button class="clear-btn" id="clearBtn">Очистить</button>
<button class="select-btn" id="selectBtn">Выделить все коды</button>
            </div>

            <div class="panel">
                <div class="panel-title">Коды</div>

                <div class="codes-list" id="codesList">
                    <div class="empty-state">Коды появятся здесь</div>
                </div>
            </div>
        </div>

        <div class="timer-bar">
            <div id="progress"></div>
        </div>

        <div class="status" id="timer">ОЖИДАНИЕ</div>
    </div>

<script>

const themeBtn = document.getElementById('themeBtn');

if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light');
}

if (themeBtn) {
    themeBtn.addEventListener('click', () => {
        document.body.classList.toggle('light');

        localStorage.setItem(
            'theme',
            document.body.classList.contains('light')
                ? 'light'
                : 'dark'
        );
    });
}

    const secretsInput = document.getElementById('secrets');
    const clearBtn = document.getElementById('clearBtn');
    const selectBtn = document.getElementById('selectBtn');
    const codesList = document.getElementById('codesList');
    const progress = document.getElementById('progress');
    const timerText = document.getElementById('timer');

    const MAX_KEYS = 8;
    let isShowingCopyMessage = false;

    function base32tohex(base32) {
        const base32chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        let bits = "";
        let hex = "";

        base32 = base32.replace(/\s/g, '').toUpperCase();

        for (let i = 0; i < base32.length; i++) {
            const val = base32chars.indexOf(base32.charAt(i));

            if (val === -1) {
                continue;
            }

            bits += val.toString(2).padStart(5, '0');
        }

        for (let i = 0; i + 4 <= bits.length; i += 4) {
            const chunk = bits.substr(i, 4);
            hex += parseInt(chunk, 2).toString(16);
        }

        return hex;
    }

    function generateOTP(secret) {
        const keyHex = base32tohex(secret);

        if (!keyHex) {
            return "ERROR";
        }

        const epoch = Math.round(new Date().getTime() / 1000.0);

        let time = Math.floor(epoch / 30).toString(16);
        while (time.length < 16) {
            time = "0" + time;
        }

        const shaObj = new jsSHA("SHA-1", "HEX");
        shaObj.setHMACKey(keyHex, "HEX");
        shaObj.update(time);

        const hmac = shaObj.getHMAC("HEX");
        const offset = parseInt(hmac.substring(hmac.length - 1), 16);

        let otp = (parseInt(hmac.substr(offset * 2, 8), 16) & 0x7fffffff) + "";
        otp = otp.substr(otp.length - 6, 6);

        return otp;
    }

    function getSecrets() {
        return secretsInput.value
            .split('\n')
            .map(item => item.trim())
            .filter(item => item.length > 0)
            .slice(0, MAX_KEYS);
    }

    async function copyCode(code, element) {
        if (!code || code === "ERROR") {
            return;
        }

        try {
            await navigator.clipboard.writeText(code);

            isShowingCopyMessage = true;

            element.style.color = "var(--success)";
            timerText.innerText = "СКОПИРОВАНО В БУФЕР";
            timerText.style.color = "var(--success)";
            progress.style.backgroundColor = "var(--success)";

            setTimeout(() => {
                isShowingCopyMessage = false;

                element.style.color = "var(--accent)";
                timerText.style.color = "var(--muted)";
                progress.style.backgroundColor = "var(--accent)";

                update();
            }, 1200);

        } catch (err) {
            timerText.innerText = "ОШИБКА КОПИРОВАНИЯ";
            timerText.style.color = "var(--danger)";
        }
    }

    function createCodeRow(value, isError = false) {
        const row = document.createElement('div');
        row.className = 'code-row';

        const code = document.createElement('div');
        code.className = 'code';
        code.innerText = value;

        if (isError) {
            code.style.color = "var(--danger)";
        } else {
            code.title = 'Нажми, чтобы скопировать';
            code.addEventListener('click', () => copyCode(value, code));
        }

        row.appendChild(code);
        return row;
    }

    
function selectAllCodes() {

    const codes = [
        ...document.querySelectorAll('.code')
    ].map(el => el.innerText);


    if (!codes.length) {
        return;
    }


    const buffer = document.getElementById('selectionBuffer');

    buffer.innerText = codes.join("\n");


    const selection = window.getSelection();

    selection.removeAllRanges();


    const range = document.createRange();

    range.selectNodeContents(buffer);


    selection.addRange(range);

    document
        .querySelectorAll('.code-row')
        .forEach(row => {
            row.classList.add('selected');
        });


    const btn = document.getElementById('selectBtn');

    btn.innerText = "Коды выделены ✓";


    setTimeout(() => {
        
document
    .querySelectorAll('.code-row')
    .forEach(row => {
        row.classList.remove('selected');
    });

        btn.innerText = "Выделить все коды";
    }, 1800);

}


function update() {
        const secrets = getSecrets();

        codesList.innerHTML = "";

        if (secrets.length === 0) {
            codesList.innerHTML = '<div class="empty-state">Коды появятся здесь</div>';
            progress.style.width = "100%";

            if (!isShowingCopyMessage) {
                timerText.innerText = "ОЖИДАНИЕ";
                timerText.style.color = "var(--muted)";
            }

            return;
        }

        secrets.forEach(secret => {
            const otp = generateOTP(secret);
            const isError = otp === "ERROR";

            codesList.appendChild(createCodeRow(otp, isError));
        });

        const epoch = Math.round(new Date().getTime() / 1000.0);
        const seconds = epoch % 30;
        const left = 30 - seconds;

        progress.style.width = (left / 30 * 100) + "%";

        if (!isShowingCopyMessage) {
            timerText.innerText = `ОБНОВЛЕНИЕ ЧЕРЕЗ ${left}`;
            timerText.style.color = "var(--muted)";
        }
    }

    
selectBtn.addEventListener('click', () => {
    selectAllCodes();
});


clearBtn.addEventListener('click', () => {

        secretsInput.value = "";
        codesList.innerHTML = '<div class="empty-state">Коды появятся здесь</div>';
        progress.style.width = "100%";
        progress.style.backgroundColor = "var(--accent)";
        timerText.innerText = "ОЖИДАНИЕ";
        timerText.style.color = "var(--muted)";
        update();
        secretsInput.focus();
    });

    secretsInput.addEventListener('input', update);

    setInterval(update, 1000);

    window.onload = () => {
        secretsInput.focus();
        update();
    };
</script>

<div id="selectionBuffer" style="
    position:fixed;
    left:-9999px;
    top:-9999px;
    white-space:pre;
"></div>

</body>
</html>
