<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Swift</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otplib/12.0.1/otplib-browser.js"></script>
    <style>
        :root { --bg: #000000; --card: #1c1c1e; --accent: #0A84FF; --text: #ffffff; }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }
        .container { width: 90%; max-width: 400px; text-align: center; }
        .card { 
            background: var(--card); padding: 40px 20px; 
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input { 
            width: 80%; background: #2c2c2e; border: none; 
            border-radius: 12px; padding: 15px; color: white; 
            font-size: 16px; margin-bottom: 30px; outline: none; text-align: center;
        }
        .code { 
            font-size: 64px; font-weight: 800; color: var(--accent); 
            letter-spacing: 5px; margin-bottom: 20px; cursor: pointer;
        }
        .timer-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; }
        #progress { width: 100%; height: 100%; background: var(--accent); transition: width 1s linear; }
        .hint { color: #8e8e93; font-size: 13px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <input type="text" id="secret" placeholder="Вставьте Secret Key" spellcheck="false">
        <div class="code" id="otp">000000</div>
        <div class="timer-bar"><div id="progress"></div></div>
        <div class="hint" id="status">Введите ключ</div>
    </div>
</div>

<script>
    const otplib = window.otplib;
    const secretInput = document.getElementById('secret');
    const otpDisplay = document.getElementById('otp');
    const progress = document.getElementById('progress');

    function update() {
        const secret = secretInput.value.replace(/\s/g, '').toUpperCase();
        if (!secret) return;

        try {
            // Генерируем код прямо в браузере!
            const token = otplib.authenticator.generate(secret);
            otpDisplay.innerText = token;
            
            const timeLeft = 30 - (Math.floor(Date.now() / 1000) % 30);
            progress.style.width = (timeLeft / 30 * 100) + "%";
            document.getElementById('status').innerText = `Обновление через ${timeLeft}с`;
        } catch (err) {
            otpDisplay.innerText = "ERROR";
        }
    }

    // Копирование по тапу
    otpDisplay.onclick = () => {
        navigator.clipboard.writeText(otpDisplay.innerText);
        const oldColor = otpDisplay.style.color;
        otpDisplay.style.color = "#32D74B"; // Зеленый при успехе
        setTimeout(() => otpDisplay.style.color = oldColor, 500);
    };

    secretInput.addEventListener('input', update);
    setInterval(update, 1000);
</script>

</body>
</html>
