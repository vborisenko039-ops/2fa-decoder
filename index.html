<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2FA Swift</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsSHA/2.4.2/sha.js"></script>
    <style>
        :root { --bg: #000; --card: #1c1c1e; --accent: #0A84FF; --text: #fff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card); padding: 30px; border-radius: 24px; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        input { width: 100%; background: #2c2c2e; border: 2px solid #3a3a3c; border-radius: 12px; padding: 12px; color: white; font-size: 14px; margin-bottom: 20px; outline: none; box-sizing: border-box; text-align: center; }
        .code { font-size: 64px; font-weight: 800; color: var(--accent); letter-spacing: 4px; margin: 10px 0; }
        .timer-bar { width: 100%; height: 4px; background: #333; margin-top: 20px; border-radius: 2px; overflow: hidden; }
        #progress { height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
    </style>
</head>
<body>
    <div class="card">
        <input type="text" id="secret" placeholder="Вставьте любой ключ" spellcheck="false">
        <div class="code" id="otp">000000</div>
        <div class="timer-bar"><div id="progress"></div></div>
        <div id="status" style="color: #8e8e93; font-size: 12px; margin-top: 10px;">ГОТОВ К РАБОТЕ</div>
    </div>

<script>
    // Функция генерации кода из ЛЮБОГО текста (не только Base32)
    function dec2hex(s) { return (s < 15.5 ? '0' : '') + Math.round(s).toString(16); }
    function hex2dec(s) { return parseInt(s, 16); }
    function leftpad(str, len, pad) { if (len + 1 >= str.length) { str = Array(len + 1 - str.length).join(pad) + str; } return str; }

    const secretInput = document.getElementById('secret');
    const otpDisplay = document.getElementById('otp');
    const progress = document.getElementById('progress');

    function update() {
        const secret = secretInput.value.trim();
        if (!secret) { otpDisplay.innerText = "000000"; return; }

        try {
            const epoch = Math.round(new Date().getTime() / 1000.0);
            const time = leftpad(dec2hex(Math.floor(epoch / 30)), 16, '0');
            
            // Генерируем HMAC-SHA1
            const shaObj = new jsSHA("SHA-1", "TEXT");
            shaObj.setHMACKey(secret, "TEXT");
            shaObj.update(time);
            const hmac = shaObj.getHMAC("HEX");

            const offset = hex2dec(hmac.substring(hmac.length - 1));
            let otp = (hex2dec(hmac.substr(offset * 2, 8)) & hex2dec('7fffffff')) + '';
            otp = otp.substr(otp.length - 6, 6);
            
            otpDisplay.innerText = otp;
            
            const seconds = Math.floor(Date.now() / 1000) % 30;
            progress.style.width = ((30 - seconds) / 30 * 100) + "%";
            document.getElementById('status').innerText = "ОБНОВЛЕНИЕ ЧЕРЕЗ " + (30 - seconds) + "с";
        } catch (e) {
            otpDisplay.innerText = "ERROR";
        }
    }

    secretInput.addEventListener('input', update);
    setInterval(update, 1000);
</script>
</body>
</html>
